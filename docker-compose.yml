# Ambiente local do administrativo: PHP-FPM (app), filas (queue), nginx (web), PostgreSQL (db) e S3 (s3).
# Painel: http://localhost:8000. Banco: localhost:5432. S3: http://localhost.localstack.cloud:4566.
services:
  app:
    build: ./docker/php
    image: yantra-painel-php:dev
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_healthy

  queue:
    image: yantra-painel-php:dev
    command: php artisan queue:work --tries=3 --sleep=3
    volumes:
      - ./:/var/www/html
    depends_on:
      - app
    restart: unless-stopped

  web:
    image: nginx:1.29-alpine
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-yantra_painel}
      POSTGRES_USER: ${DB_USERNAME:-yantra}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-yantra}
    ports:
      - "5432:5432"
    volumes:
      # O PostgreSQL 18 grava os dados em /var/lib/postgresql/18/docker.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3 local (LocalStack). O MinIO não publica mais imagens Docker.
  # O nome localhost.localstack.cloud aponta para 127.0.0.1 no computador e para este
  # container na rede do Docker. Assim, as URLs assinadas funcionam nos dois lados.
  s3:
    image: localstack/localstack:4.9
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-sa-east-1}
      S3_BUCKET: ${AWS_BUCKET:-yantra-painel}
    ports:
      - "4566:4566"
    volumes:
      - ./docker/localstack/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh:ro
    networks:
      default:
        aliases:
          - localhost.localstack.cloud
    healthcheck:
      test: ["CMD-SHELL", "awslocal s3api head-bucket --bucket $${S3_BUCKET}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Navegador de arquivos do S3 local: http://localhost:8081.
  s3-browser:
    image: cloudlena/s3manager:v0.5.0
    environment:
      ENDPOINT: localhost.localstack.cloud:4566
      ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      REGION: ${AWS_DEFAULT_REGION:-sa-east-1}
      USE_SSL: "false"
      ALLOW_DELETE: "true"
    ports:
      - "8081:8080"
    depends_on:
      s3:
        condition: service_healthy

volumes:
  pgdata:
