; Ambiente de desenvolvimento: o PHP-FPM roda como root, igual ao artisan, aos testes, à fila e ao agendador.
; Sem isso, um arquivo criado por um comando do artisan (root, permissão 644) bloqueia o PHP-FPM (www-data):
; o laravel.log e as views compiladas dão "Permission denied".
; Cuidado: não use esta configuração em produção.
[www]
user = root
group = root
